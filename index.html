<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YVRIDIO'09 - satu kelas, satu cerita." />
    <meta name="theme-color" content="#07111f" />
    <title>YVRIDIO'09 - Satu Kelas, Satu Cerita</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <div class="stars2" aria-hidden="true"></div>
    <div id="react-root"></div>

    <audio id="bg-music" preload="metadata"></audio>

    <div id="modal" aria-hidden="true">
      <div class="modal-content">
        <button class="modal-close" type="button" onclick="closeModal()" aria-label="Tutup foto">&times;</button>
        <button class="modal-nav modal-prev" type="button" onclick="previousPhoto()" aria-label="Foto sebelumnya">&#8249;</button>
        <img id="modal-img" alt="Kenangan kelas" />
        <span class="modal-counter" id="modal-counter"></span>
        <button class="modal-nav modal-next" type="button" onclick="nextPhoto()" aria-label="Foto berikutnya">&#8250;</button>
      </div>
    </div>

    <div id="memberDetailModal" aria-hidden="true">
      <button type="button" class="modal-close" onclick="closeMemberDetail()" aria-label="Tutup detail anggota">&times;</button>
      <div class="member-detail-content">
        <img id="detailPhoto" src="/assets/images/anggota/anonim.jpeg" alt="Foto anggota" />
        <h2 id="detailName">Nama teman</h2>
        <p id="detailBio">Teman sekelas YVRIDIO'09</p>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
